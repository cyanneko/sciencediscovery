version: 1
id: e2e.real
owner: product-journeys
description: Opt-in Playwright real-user smoke against a live model
layer: e2e
surface: browser
runner: playwright
capabilities:
  - real
llm:
  mode: real
supportedExecutors:
  - native
  - jiuwenswarm
timeoutSeconds: 3600
requirements:
  - clean-worktree
gates:
  allowEnv: CI_ALLOW_REAL
  requiredEnv:
    - E2E_LLM_BASE_URL
    - E2E_LLM_MODEL
    - E2E_LLM_TOKEN
ci: {}
resultPath: e2e-real
compatibility:
  command:
    - pnpm
    - ci:e2e:real
tags:
  - arch:amd64
  - arch:arm64
  - container:conditional
  - network:external
  - npu:none
  - sandbox:bubblewrap
