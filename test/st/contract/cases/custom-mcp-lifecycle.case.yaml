version: 1
id: st.contract.custom-mcp-lifecycle
source: mcp.json
owner: api-adapter
description: A custom stdio MCP server (test/fixtures/mcp-echo.mjs, run with
  node from the repository root) saved, tested, inspected, renamed, imported and
  deleted, and the data-source, connector and invocation reads. No network.
layer: st
surface: api
runner: contract
capabilities:
  - contract
llm:
  mode: none
supportedExecutors:
  - native
  - jiuwenswarm
timeoutSeconds: 180
requirements:
  - contract-target
gates:
  allowEnv: CI_ALLOW_CONTRACT
  requiredEnv:
    - E2E_BASE_URL
    - E2E_API_TOKEN
    - E2E_CONTRACT_BASELINE
    - E2E_TARGET_EXECUTOR
ci:
  daily:
    executors:
      - native
      - jiuwenswarm
    required: false
    reason: CI does not yet provision isolated contract targets and select reviewed
      platform-specific baselines; keep missing coverage visible.
scenarioId: custom-mcp-lifecycle
resultPath: contract-custom-mcp-lifecycle
assertions:
  mode: deterministic
