version: 1
id: st.contract.run-slow-tool
source: run-events.json
owner: api-adapter
description: A shell command that takes 40 seconds. JiuwenSwarm gives an MCP
  call 30 seconds unless told otherwise, so this run ends in an error there
  unless the adapter raises the limit.
layer: st
surface: api
runner: contract
capabilities:
  - contract
llm:
  mode: stub
supportedExecutors:
  - native
  - jiuwenswarm
timeoutSeconds: 180
requirements:
  - contract-target
gates:
  allowEnv: CI_ALLOW_CONTRACT
  requiredEnv:
    - E2E_BASE_URL
    - E2E_API_TOKEN
    - E2E_CONTRACT_BASELINE
    - E2E_TARGET_EXECUTOR
ci:
  daily:
    executors:
      - native
      - jiuwenswarm
    required: false
    reason: CI does not yet provision isolated contract targets and select reviewed
      platform-specific baselines; keep missing coverage visible.
scenarioId: run-slow-tool
resultPath: contract-run-slow-tool
