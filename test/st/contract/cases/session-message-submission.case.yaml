version: 1
id: st.contract.session-message-submission
source: run-events.json
owner: api-adapter
description: "Sending a message with POST /messages: the answer to the request
  is the run's event stream."
layer: st
surface: api
runner: contract
capabilities:
  - contract
llm:
  mode: stub
supportedExecutors:
  - native
  - jiuwenswarm
timeoutSeconds: 180
requirements:
  - contract-target
gates:
  allowEnv: CI_ALLOW_CONTRACT
  requiredEnv:
    - E2E_BASE_URL
    - E2E_API_TOKEN
    - E2E_CONTRACT_BASELINE
    - E2E_TARGET_EXECUTOR
ci:
  daily:
    executors:
      - native
      - jiuwenswarm
    required: false
    reason: CI does not yet provision isolated contract targets and select reviewed
      platform-specific baselines; keep missing coverage visible.
scenarioId: session-message-submission
resultPath: contract-session-message-submission
assertions:
  mode: deterministic
