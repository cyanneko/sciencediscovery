version: 1
id: st.contract.l2-tool-call
source: l2-runs.json
owner: api-adapter
description: A shell call, then the answer.
layer: st
surface: api
runner: contract
capabilities:
  - contract
llm:
  mode: stub
supportedExecutors:
  - native
  - jiuwenswarm
timeoutSeconds: 180
requirements:
  - contract-target
gates:
  allowEnv: CI_ALLOW_CONTRACT
  requiredEnv:
    - E2E_BASE_URL
    - E2E_API_TOKEN
    - E2E_CONTRACT_BASELINE
    - E2E_TARGET_EXECUTOR
ci:
  daily:
    executors:
      - native
      - jiuwenswarm
    required: false
    reason: CI does not yet provision isolated contract targets and select reviewed
      platform-specific baselines; keep missing coverage visible.
scenarioId: l2-tool-call
resultPath: contract-l2-tool-call
