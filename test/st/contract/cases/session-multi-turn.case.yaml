version: 1
id: st.contract.session-multi-turn
source: run-events.json
owner: api-adapter
description: Two messages in one session, each with a shell call. The second
  run's events show what a conversation that already has history looks like;
  both executors must produce the same sequence.
layer: st
surface: api
runner: contract
capabilities:
  - contract
llm:
  mode: stub
supportedExecutors:
  - native
  - jiuwenswarm
timeoutSeconds: 180
requirements:
  - contract-target
gates:
  allowEnv: CI_ALLOW_CONTRACT
  requiredEnv:
    - E2E_BASE_URL
    - E2E_API_TOKEN
    - E2E_CONTRACT_BASELINE
    - E2E_TARGET_EXECUTOR
ci:
  daily:
    executors:
      - native
      - jiuwenswarm
    required: false
    reason: CI does not yet provision isolated contract targets and select reviewed
      platform-specific baselines; keep missing coverage visible.
scenarioId: session-multi-turn
resultPath: contract-session-multi-turn
assertions:
  mode: deterministic
