version: 1
id: st.contract.global-settings-round-trips
source: settings-models.json
owner: api-adapter
description: "Every global settings route: read, change one value, read it back,
  restore the original. Nothing is left changed."
layer: st
surface: api
runner: contract
capabilities:
  - contract
llm:
  mode: none
supportedExecutors:
  - native
  - jiuwenswarm
timeoutSeconds: 180
requirements:
  - contract-target
gates:
  allowEnv: CI_ALLOW_CONTRACT
  requiredEnv:
    - E2E_BASE_URL
    - E2E_API_TOKEN
    - E2E_CONTRACT_BASELINE
    - E2E_TARGET_EXECUTOR
ci:
  daily:
    executors:
      - native
      - jiuwenswarm
    required: false
    reason: CI does not yet provision isolated contract targets and select reviewed
      platform-specific baselines; keep missing coverage visible.
scenarioId: global-settings-round-trips
resultPath: contract-global-settings-round-trips
assertions:
  mode: deterministic
