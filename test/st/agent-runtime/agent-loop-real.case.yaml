version: 1
id: st.agent-loop-real
source: agent-loop-real.ts
owner: product-journeys
description: Node-native agent loop against an explicitly authorized live model
layer: st
surface: process
runner: layer
capabilities:
  - agent-loop-real
llm:
  mode: real
  model:
    protocol: chat-completions
    baseUrlEnv: SCIENCE_AGENT_LLM_BASE_URL
    modelEnv: SCIENCE_AGENT_LLM_MODEL
    apiKeyEnv: SCIENCE_AGENT_LLM_API_TOKEN
supportedExecutors:
  - native
timeoutSeconds: 3600
requirements: []
gates:
  allowEnv: CI_ALLOW_REAL
  requiredEnv:
    - SCIENCE_AGENT_LLM_BASE_URL
    - SCIENCE_AGENT_LLM_MODEL
    - SCIENCE_AGENT_LLM_API_TOKEN
ci: {}
command:
  - node
  - .ci/layer-worker.mjs
  - st-real
resultPath: st-real
compatibility:
  command:
    - pnpm
    - ci:st:real
tags:
  - arch:amd64
  - arch:arm64
  - container:conditional
  - network:external
  - npu:none
  - sandbox:none
assertions:
  mode: deterministic
