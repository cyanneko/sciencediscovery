version: 1
id: e2e.browser.journey-first-run
source: journey-first-run.spec.ts
owner: product-journeys
description: Deterministic Playwright journeys against an isolated local stack
layer: e2e
surface: browser
runner: playwright
capabilities:
  - journey-first-run
  - model
  - session
  - mcp
  - sandbox
llm:
  mode: stub
supportedExecutors:
  - native
  - jiuwenswarm
timeoutSeconds: 3600
requirements:
  - clean-worktree
ci:
  daily:
    executors:
      - native
      - jiuwenswarm
    required: true
  pr:
    executors:
      - jiuwenswarm
    required: true
resultPath: browser-journey-first-run-mocked
tags:
  - arch:amd64
  - arch:arm64
  - container:conditional
  - network:local
  - npu:none
  - sandbox:bubblewrap
