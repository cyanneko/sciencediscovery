version: 1
id: e2e.browser.journey-execution-management
source: journey-execution-management.spec.ts
owner: product-journeys
description: Deterministic Playwright journeys against an isolated local stack
layer: e2e
surface: browser
runner: playwright
capabilities:
  - journey-execution-management
  - session
  - mcp
llm:
  mode: none
supportedExecutors:
  - native
  - jiuwenswarm
timeoutSeconds: 3600
requirements:
  - clean-worktree
ci:
  daily:
    executors:
      - native
      - jiuwenswarm
    required: true
  pr:
    executors:
      - jiuwenswarm
    required: true
resultPath: browser-journey-execution-management-mocked
tags:
  - arch:amd64
  - arch:arm64
  - container:conditional
  - network:local
  - npu:none
  - sandbox:bubblewrap
