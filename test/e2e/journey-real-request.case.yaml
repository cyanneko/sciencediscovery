version: 1
id: e2e.browser.journey-real-request
source: journey-real-request.spec.ts
owner: product-journeys
description: Opt-in Playwright real-user smoke against a live model
layer: e2e
surface: browser
runner: playwright
capabilities:
  - journey-real-request
  - model
  - session
  - artifact
  - runner
  - mcp
  - sandbox
llm:
  mode: real
supportedExecutors:
  - native
  - jiuwenswarm
timeoutSeconds: 3600
requirements:
  - clean-worktree
gates:
  allowEnv: CI_ALLOW_REAL
  requiredEnv:
    - E2E_LLM_BASE_URL
    - E2E_LLM_MODEL
    - E2E_LLM_TOKEN
ci: {}
resultPath: browser-journey-real-request-real
tags:
  - arch:amd64
  - arch:arm64
  - container:conditional
  - network:external
  - npu:none
  - sandbox:bubblewrap
