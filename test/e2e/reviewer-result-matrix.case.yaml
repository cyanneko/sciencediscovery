    executors:
      - native
      - jiuwenswarm
    required: true
resultPath: browser-reviewer-result-matrix-mocked
tags:
  - arch:amd64
  - arch:arm64
  - container:conditional
  - network:local
  - npu:none
  - sandbox:bubblewrap
reporting: steps
