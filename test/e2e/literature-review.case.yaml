version: 1
id: e2e.browser.literature-review
source: literature-review.spec.ts
owner: product-journeys
description: Opt-in Playwright real-user smoke against a live model
layer: e2e
surface: browser
runner: playwright
capabilities:
  - literature-review
  - model
  - session
  - artifact
  - mcp
  - runner
llm:
  mode: real
  model:
    protocol: chat-completions
    baseUrlEnv: E2E_LLM_BASE_URL
    modelEnv: E2E_LLM_MODEL
    apiKeyEnv: E2E_LLM_TOKEN
supportedExecutors:
  - native
  - jiuwenswarm
timeoutSeconds: 3600
requirements:
  - clean-worktree
gates:
  allowEnv: CI_ALLOW_REAL
  requiredEnv:
    - E2E_LLM_BASE_URL
    - E2E_LLM_MODEL
    - E2E_LLM_TOKEN
ci:
  daily:
    executors:
      - native
      - jiuwenswarm
    required: true
resultPath: browser-literature-review-real
tags:
  - arch:amd64
  - arch:arm64
  - container:conditional
  - network:external
  - npu:none
  - sandbox:bubblewrap
assertions:
  mode: deterministic
